<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0" stop-color="#1d2e3f"/>
      <stop offset="0.6" stop-color="#121b26"/>
      <stop offset="1" stop-color="#0a0f15"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#66bbff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#66bbff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d27a"/>
      <stop offset="1" stop-color="#9c7326"/>
    </linearGradient>
    <linearGradient id="slot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2f36"/>
      <stop offset="1" stop-color="#15191e"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a5a"/>
      <stop offset="1" stop-color="#8e1a10"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fd3ff"/>
      <stop offset="1" stop-color="#1c5aa0"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ef07a"/>
      <stop offset="1" stop-color="#2f7a1c"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#a0611c"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7a0ff"/>
      <stop offset="1" stop-color="#5a2a9c"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="400" height="400" rx="56" fill="url(#bg)"/>
  <rect x="14" y="14" width="372" height="372" rx="44" fill="none" stroke="url(#gold)" stroke-width="6"/>
  <circle cx="200" cy="200" r="165" fill="url(#glow)"/>

  <!-- a 3 x 3 action bar: filled buttons, and planned ones waiting (dashed) -->
  <g transform="translate(200,200)">
    <!-- row 1 -->
    <g transform="translate(-104,-104)">
      <rect x="-42" y="-42" width="84" height="84" rx="12" fill="url(#red)" stroke="#e8c46a" stroke-width="5"/>
      <path d="M -8 8 L 24 -24 L 26 -26" fill="none" stroke="#fff4e0" stroke-width="9" stroke-linecap="round"/>
      <path d="M -20 -2 L 2 20" stroke="#fff4e0" stroke-width="8" stroke-linecap="round"/>
      <path d="M -10 10 L -24 24" stroke="#fff4e0" stroke-width="7" stroke-linecap="round"/>
      <circle cx="-26" cy="26" r="5" fill="#fff4e0"/>
      <rect x="-40" y="-40" width="80" height="80" rx="10" fill="url(#shine)"/>
    </g>
    <g transform="translate(0,-104)">
      <rect x="-42" y="-42" width="84" height="84" rx="12" fill="url(#blue)" stroke="#e8c46a" stroke-width="5"/>
      <path d="M 0 -26 L 22 -16 L 22 4 C 22 18 10 26 0 30 C -10 26 -22 18 -22 4 L -22 -16 Z" fill="none" stroke="#f0faff" stroke-width="7" stroke-linejoin="round"/>
      <rect x="-40" y="-40" width="80" height="80" rx="10" fill="url(#shine)"/>
    </g>
    <g transform="translate(104,-104)">
      <rect x="-42" y="-42" width="84" height="84" rx="12" fill="url(#amber)" stroke="#e8c46a" stroke-width="5"/>
      <path d="M -6 -28 L -18 4 L 0 4 L -6 28 L 18 -6 L 0 -6 L 8 -28 Z" fill="#fff6dc"/>
      <rect x="-40" y="-40" width="80" height="80" rx="10" fill="url(#shine)"/>
    </g>
    <!-- row 2 -->
    <g transform="translate(-104,0)">
      <rect x="-42" y="-42" width="84" height="84" rx="12" fill="url(#green)" stroke="#e8c46a" stroke-width="5"/>
      <path d="M 0 -24 C 14 -6 22 4 22 12 C 22 24 12 30 0 30 C -12 30 -22 24 -22 12 C -22 4 -14 -6 0 -24 Z" fill="#effde6"/>
      <rect x="-40" y="-40" width="80" height="80" rx="10" fill="url(#shine)"/>
    </g>
    <g transform="translate(0,0)">
      <rect x="-42" y="-42" width="84" height="84" rx="12" fill="url(#violet)" stroke="#e8c46a" stroke-width="5"/>
      <path d="M 0 -26 L 7 -7 L 27 -7 L 11 5 L 17 25 L 0 13 L -17 25 L -11 5 L -27 -7 L -7 -7 Z" fill="#f6ecff"/>
      <rect x="-40" y="-40" width="80" height="80" rx="10" fill="url(#shine)"/>
    </g>
    <g transform="translate(104,0)">
      <rect x="-42" y="-42" width="84" height="84" rx="12" fill="url(#slot)" stroke="#66bbff" stroke-width="4" stroke-dasharray="10 8"/>
      <path d="M 0 -16 L 0 16 M -16 0 L 16 0" stroke="#66bbff" stroke-opacity="0.85" stroke-width="7" stroke-linecap="round"/>
    </g>
    <!-- row 3 -->
    <g transform="translate(-104,104)">
      <rect x="-42" y="-42" width="84" height="84" rx="12" fill="url(#slot)" stroke="#66bbff" stroke-width="4" stroke-dasharray="10 8"/>
      <path d="M 0 -16 L 0 16 M -16 0 L 16 0" stroke="#66bbff" stroke-opacity="0.85" stroke-width="7" stroke-linecap="round"/>
    </g>
    <g transform="translate(0,104)">
      <rect x="-42" y="-42" width="84" height="84" rx="12" fill="url(#slot)" stroke="#66bbff" stroke-width="4" stroke-dasharray="10 8"/>
      <path d="M 0 -16 L 0 16 M -16 0 L 16 0" stroke="#66bbff" stroke-opacity="0.85" stroke-width="7" stroke-linecap="round"/>
    </g>
    <g transform="translate(104,104)">
      <rect x="-42" y="-42" width="84" height="84" rx="12" fill="url(#slot)" stroke="#66bbff" stroke-width="4" stroke-dasharray="10 8"/>
      <path d="M 0 -16 L 0 16 M -16 0 L 16 0" stroke="#66bbff" stroke-opacity="0.85" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>
</svg>
