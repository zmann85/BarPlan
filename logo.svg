<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
<defs>
  <radialGradient id="bg" cx="50%" cy="42%" r="65%">
    <stop offset="0" stop-color="#3a2a1c"/><stop offset="0.6" stop-color="#1c1510"/><stop offset="1" stop-color="#0e0b08"/>
  </radialGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#f2b860" stop-opacity="0.30"/><stop offset="1" stop-color="#f2b860" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d27a"/><stop offset="1" stop-color="#9c7326"/></linearGradient>
  <radialGradient id="paper" cx="45%" cy="40%" r="75%">
    <stop offset="0" stop-color="#f4e3b8"/><stop offset="0.7" stop-color="#e2c68c"/><stop offset="1" stop-color="#b8935a"/>
  </radialGradient>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="4" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="6"/>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="9" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.22  0 0 0 0 0.08  0 0 0 -0.9 0.5"/>
  </filter>
  <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfc6b4"/></linearGradient>
</defs>
<rect x="0" y="0" width="400" height="400" rx="56" fill="url(#bg)"/>
<rect x="14" y="14" width="372" height="372" rx="44" fill="none" stroke="url(#gold)" stroke-width="6"/>
<circle cx="200" cy="205" r="160" fill="url(#glow)"/>

<g transform="translate(196,206) rotate(-4)">
  <!-- the sheet, with a shadow -->
  <rect x="-128" y="-122" width="256" height="252" rx="6" fill="#000" fill-opacity="0.45" transform="translate(7,9)" filter="url(#rough)"/>
  <g filter="url(#rough)">
    <rect x="-128" y="-122" width="256" height="252" rx="6" fill="url(#paper)"/>
    <rect x="-128" y="-122" width="256" height="252" rx="6" filter="url(#grain)"/>
  </g>
  <!-- a title line, like a heading written on the plan -->
  <path d="M -96 -92 C -60 -98 -20 -86 20 -94 C 44 -98 70 -92 96 -96" fill="none" stroke="#4a3418" stroke-width="5" stroke-linecap="round"/>
  <path d="M -96 -76 C -70 -80 -40 -72 -10 -78" fill="none" stroke="#4a3418" stroke-opacity="0.6" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="-118.0" y="-73.0" width="50" height="50" rx="5" fill="#d9c08a" stroke="#4a3418" stroke-width="3.5"/><path d="M -106.0 -47.0 L -97.0 -37.0 L -79.0 -59.0" fill="none" stroke="#7a2a12" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="-56.0" y="-73.0" width="50" height="50" rx="5" fill="#d9c08a" stroke="#4a3418" stroke-width="3.5"/><path d="M -44.0 -47.0 L -35.0 -37.0 L -17.0 -59.0" fill="none" stroke="#7a2a12" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="6.0" y="-73.0" width="50" height="50" rx="5" fill="#d9c08a" stroke="#4a3418" stroke-width="3.5"/><path d="M 18.0 -47.0 L 27.0 -37.0 L 45.0 -59.0" fill="none" stroke="#7a2a12" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="68.0" y="-73.0" width="50" height="50" rx="5" fill="#d9c08a" stroke="#4a3418" stroke-width="3.5"/><path d="M 80.0 -47.0 L 89.0 -37.0 L 107.0 -59.0" fill="none" stroke="#7a2a12" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="-118.0" y="-11.0" width="50" height="50" rx="5" fill="#d9c08a" stroke="#4a3418" stroke-width="3.5"/><path d="M -106.0 15.0 L -97.0 25.0 L -79.0 3.0" fill="none" stroke="#7a2a12" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="-56.0" y="-11.0" width="50" height="50" rx="5" fill="#d9c08a" stroke="#4a3418" stroke-width="3.5"/><path d="M -44.0 15.0 L -35.0 25.0 L -17.0 3.0" fill="none" stroke="#7a2a12" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="6.0" y="-11.0" width="50" height="50" rx="5" fill="none" stroke="#4a3418" stroke-opacity="0.75" stroke-width="3" stroke-dasharray="7 6"/><rect x="68.0" y="-11.0" width="50" height="50" rx="5" fill="none" stroke="#4a3418" stroke-opacity="0.75" stroke-width="3" stroke-dasharray="7 6"/><rect x="-118.0" y="51.0" width="50" height="50" rx="5" fill="none" stroke="#4a3418" stroke-opacity="0.75" stroke-width="3" stroke-dasharray="7 6"/><rect x="-56.0" y="51.0" width="50" height="50" rx="5" fill="none" stroke="#4a3418" stroke-opacity="0.75" stroke-width="3" stroke-dasharray="7 6"/><rect x="6.0" y="51.0" width="50" height="50" rx="5" fill="none" stroke="#4a3418" stroke-opacity="0.75" stroke-width="3" stroke-dasharray="7 6"/><rect x="68.0" y="51.0" width="50" height="50" rx="5" fill="none" stroke="#4a3418" stroke-opacity="0.75" stroke-width="3" stroke-dasharray="7 6"/>
</g>

<!-- quill, writing in the next slot of the plan -->
<g transform="translate(250,195) rotate(41)">
  <ellipse cx="10" cy="-60" rx="16" ry="96" fill="#000" fill-opacity="0.35" transform="translate(8,6)"/>
  <path d="M 0 -170 C 22 -140 24 -70 9 -14 L 0 6 L -9 -14 C -24 -70 -22 -140 0 -170 Z" fill="url(#feather)" stroke="#5e5240" stroke-width="3"/>
  <path d="M 0 -162 L 0 8" stroke="#5e5240" stroke-width="3"/>
  <g stroke="#a89a82" stroke-width="2" fill="none">
    <path d="M 0 -140 L 12 -130"/><path d="M 0 -118 L 15 -106"/><path d="M 0 -96 L 15 -83"/><path d="M 0 -74 L 13 -62"/><path d="M 0 -52 L 10 -42"/>
    <path d="M 0 -140 L -12 -130"/><path d="M 0 -118 L -15 -106"/><path d="M 0 -96 L -15 -83"/><path d="M 0 -74 L -13 -62"/><path d="M 0 -52 L -10 -42"/>
  </g>
  <path d="M -4 6 L 0 34 L 4 6 Z" fill="#2a1c10"/>
</g>
<!-- the start of a tick being written in that slot -->
<path d="M 207 214 L 214 222" fill="none" stroke="#7a2a12" stroke-width="5.5" stroke-linecap="round"/>
</svg>